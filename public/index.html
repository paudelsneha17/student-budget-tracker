<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Budget Tracker</h1>
    <p>Keep track of what comes in and what goes out.</p>
  </header>

  <main>
    <section class="cards">
      <div class="card income"><span>Income</span><strong id="income">$0.00</strong></div>
      <div class="card expense"><span>Expenses</span><strong id="expenses">$0.00</strong></div>
      <div class="card balance"><span>Balance</span><strong id="balance">$0.00</strong></div>
    </section>

    <section class="panel">
      <h2>Add a transaction</h2>
      <form id="form">
        <input id="description" placeholder="Description (e.g. Groceries)" required>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <select id="type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <select id="category"></select>
        <input id="date" type="date">
        <button type="submit">Add</button>
      </form>
      <p id="error" class="error"></p>
    </section>

    <section class="panel">
      <h2>Spending by category</h2>
      <div id="categories"><p class="muted">No expenses yet.</p></div>
    </section>

    <section class="panel">
      <h2>Transactions</h2>
      <table>
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <p id="empty" class="muted">No transactions yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
