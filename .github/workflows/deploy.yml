name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Build and push image
        run: |
          gcloud auth configure-docker --quiet
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-budget-tracker:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-budget-tracker:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy student-budget-tracker \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/student-budget-tracker:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
      - name: Show URL
        run: gcloud run services describe student-budget-tracker --region ${{ secrets.GCP_REGION }} --format='value(status.url)'
